name: Compilar ClanStats

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Compilar el mod
        working-directory: versions/mc${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v7
        with:
          name: clanstats-mc${{ matrix.mc }}
          path: versions/mc${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error
