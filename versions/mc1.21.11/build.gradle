plugins {
	// 1.21.11 es la última versión ofuscada: se usa la variante "remap" de Loom
	id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// El código común (detección de kills, estadísticas, comandos, HUD) se comparte con la versión 26.3
sourceSets {
	main {
		java {
			srcDir '../../common/src/main/java'
			// interfaces de Mod Menu solo para compilar (se excluyen del .jar, ver abajo)
			srcDir 'src/modmenuApi/java'
		}
		resources {
			srcDir '../../common/src/main/resources'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Las interfaces de Mod Menu no van en el mod: si el jugador tiene Mod Menu se usan las suyas.
tasks.named('jar') {
	exclude 'com/terraformersmc/**'
}

processResources {
	inputs.property "version", project.version
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
